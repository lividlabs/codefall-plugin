name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs only on the push that actually cuts a release —
      # the merge of the release PR. Ordinary merges to main leave the pin alone,
      # which is what makes a release gate what installs receive.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: main

      - name: Pin the marketplace entry to the released commit
        if: ${{ steps.release.outputs.release_created }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          jq --arg sha "$RELEASE_SHA" \
            '(.plugins[] | select(.name == "codefall") | .source.sha) = $sha' \
            .claude-plugin/marketplace.json > marketplace.json.tmp
          mv marketplace.json.tmp .claude-plugin/marketplace.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "marketplace already pinned to $RELEASE_SHA"
            exit 0
          fi
          git commit -m "chore: pin marketplace to ${TAG_NAME}"
          git push
